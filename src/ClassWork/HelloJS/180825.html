<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="180825.css">
    <script src="index_script.js"></script>
</head>


<body>
    <p>Перед скриптом</p>
    
    <p>После скриптом</p>

   
    <form action="/search" method="get">
        <label for="quary">Поиск</label>
        <input type="text" name="quary" id="quary">
        <select name="type" id="type">
            <option value="fruit">Фрукт</option>
            <option value="vegetable">Овощь</option>
            <option value="berry">Ягода</option>
        </select>
        <select name="color" id="color" >
            <option value="red">Красный</option>
            <option value="green">Зеленый</option>
            <option value="yellow">Желтый</option>
        </select>
        <input type="number" id="limit" name="limit" min="1" max="50" value="10">

        <input type="submit" value="Отправить">

    </form>
</body>
</html>
